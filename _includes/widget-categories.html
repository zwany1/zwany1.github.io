<div class="card-widget card-categories">
    <div class="item-headline"><i class="fas fa-folder-open"></i><span>Categories</span><a class="card-more-btn" href="/categories/" title="查看更多"><i class="fas fa-angle-right"></i></a></div>
    <ul class="card-category-list" id="aside-cat-list">
        {% assign cats = site.categories | sort %}
        {% for cat in cats limit: 8 %}
        <li class="card-category-list-item">
            <a class="card-category-list-link" href="/categories/#{{ cat[0] }}">
                <span class="card-category-list-name">{{ cat[0] }}</span>
                <span class="card-category-list-count">{{ cat[1].size }}</span>
            </a>
        </li>
        {% endfor %}
    </ul>
</div>

name: friends-rss

on:
  schedule:
    - cron: '0 3 * * *' # 每天北京时间 11 点跑一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-friends.mjs
      - name: Commit aggregated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/friends-posts.json
          git diff --cached --quiet || git commit -m "friends: update aggregated posts"
          git push

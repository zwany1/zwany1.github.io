# Cloudflare Worker + Durable Object 配置
# 部署：npx wrangler deploy      本地开发：npx wrangler dev
#
# 注意 TOML 的表顺序：一旦开了 [[xxx]] 表，后面的键都归属于它，
# 所以顶层的 routes 必须写在任何 [[表]] 之前。

name = "zwy-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 自定义域名：不要只依赖 workers.dev —— 它在国内常被 DNS 屏蔽
# （实测本机把 workers.dev 解析到了 127.0.0.1，直连 Cloudflare IP 也被重置）。
# 这里把 Worker 绑到自己的 Cloudflare 域名上，Cloudflare 会自动创建对应 DNS 记录
# （要求该 zone 在本账号下，且已 active）。
routes = [
    { pattern = "chat.myzwy.qzz.io", custom_domain = true }
]

# 一个房间 = 一个 Durable Object 实例
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# 账号存储：全局单实例（身份必须跨房间一致，不能按房间分片）
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

# v1 创建 ChatRoom。已部署过就不要再改 tag。
# Free 计划只有 SQLite 存储后端可用，所以必须用 new_sqlite_classes。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# v2 新增 Accounts
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]

# 非敏感变量（会进产物，别放密钥）
[vars]
# 登录制：只有 GitHub 身份能进聊天室，服务端不再签发匿名身份。
# 设为 "false" 可退回「匿名 + Turnstile 人机校验」模式（逻辑保留在 room.js 里）。
REQUIRE_LOGIN = "true"

# Turnstile 的 sitekey 是公开值（本来就会出现在前端），可以放这里。
# 注意：本地 .dev.vars 里的 sitekey 会覆盖它。
TURNSTILE_SITEKEY = "0x4AAAAAAFR6ILFQnlSngqbd"

# 对应 secret（TURNSTILE_SECRET / IDENTITY_SECRET / GITHUB_CLIENT_SECRET）
# 一律用 `npx wrangler secret put <名字>` 设置，绝不要写进这个文件。

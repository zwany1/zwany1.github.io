      const scriptCache = new Map();

        getScript: (url, attr = {}) => { if (scriptCache.has(url)) return scriptCache.get(url); const promise = new Promise((resolve, reject) => { const script = document.createElement('script'); script.src = url; script.async = true; for (const key in attr) script.setAttribute(key, attr[key]); script.onload = resolve; script.onerror = reject; document.head.appendChild(script); }); scriptCache.set(url, promise); return promise; },

<script>
// Post Views（文章浏览次数）：
// 由 Abacus 计数服务按 URL 精确计数（每次访问 +1），不再依赖不稳定的 busuanzi；
// localStorage 缓存上次数值，页面打开立即显示，服务无响应时用缓存兜底，该行始终可见。
// 本地预览使用 zwany1-github-io-dev 命名空间独立计数，不影响线上数据。
// 侧栏 Website Info 的本站访问量/访客数仍由不蒜子提供（本地环境隐藏）。
(function () {
    var PV_ID = 'page_views_value';
    var CACHE_KEY = 'site_stats_cache_v1';
    var TTL = 30 * 24 * 3600 * 1000; // 缓存有效期 30 天
    var SITE = [['busuanzi_value_site_pv', 'site_pv'], ['busuanzi_value_site_uv', 'site_uv']];
    var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

    function readCache() {
        try {
            var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
            if (c && Date.now() - (c.__t || 0) < TTL) return c;
        } catch (e) {}
        return null;
    }
    function writeCache(fn) {
        try {
            var c = readCache() || {};
            fn(c);
            c.__t = Date.now();
            localStorage.setItem(CACHE_KEY, JSON.stringify(c));
        } catch (e) {}
    }

    // ---------- Post Views ----------
    var pvEl = document.getElementById(PV_ID);
    var pvKey = 'pv:' + location.pathname;
    function setPv(v) { if (pvEl) pvEl.textContent = v; }

    var cached = readCache();
    if (cached && cached[pvKey]) setPv(cached[pvKey]); // 秒显上次数值

    var ns = isLocal ? 'zwany1-github-io-dev' : 'zwany1-github-io';
    var pvKeyEnc = ('pv' + location.pathname).replace(/[^a-zA-Z0-9_-]/g, '-'); // Abacus 的 key 不允许斜杠
    var pvDone = false;
    // 同一会话内刷新不重复计数（去重，避免刷新刷爆浏览量）；跨会话每次访问 +1
    var ssHit = false;
    try { ssHit = sessionStorage.getItem('pv_hit' + pvKeyEnc) === '1'; } catch (e) {}
    var pvReq = ssHit
        ? 'https://abacus.jasoncameron.dev/get/' + ns + '/' + pvKeyEnc
        : 'https://abacus.jasoncameron.dev/hit/' + ns + '/' + pvKeyEnc;
    fetch(pvReq)
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error(r.status)); })
        .then(function (d) {
            pvDone = true;
            if (d && typeof d.value === 'number') {
                setPv(d.value);
                writeCache(function (c) { c[pvKey] = d.value; });
                if (!ssHit) { try { sessionStorage.setItem('pv_hit' + pvKeyEnc, '1'); } catch (e) {} }
            }
        })
        .catch(function () {});
    setTimeout(function () { // 10 秒仍无响应：有缓存保留缓存，否则显示占位符
        if (pvDone || !pvEl) return;
        var c2 = readCache();
        setPv((c2 && c2[pvKey]) || '—');
    }, 10000);

    // ---------- 侧栏 Website Info（不蒜子：本站访问量/访客数） ----------
    function spin(el) { return el && el.querySelector('i.fa-spinner'); }
    function hideSiteRows() {
        SITE.forEach(function (p) {
            var el = document.getElementById(p[0]);
            if (el) el.closest('.webinfo-item').style.display = 'none';
        });
    }
    if (isLocal) { hideSiteRows(); return; }

    SITE.forEach(function (p) {
        var el = document.getElementById(p[0]);
        if (el && cached && cached[p[1]] && spin(el)) el.textContent = cached[p[1]];
    });
    var tries = 0;
    var timer = setInterval(function () {
        tries++;
        var el0 = document.getElementById(SITE[0][0]);
        if (el0 && /^\d+$/.test(el0.textContent.trim())) {
            clearInterval(timer);
            writeCache(function (c) {
                SITE.forEach(function (p) {
                    var el = document.getElementById(p[0]);
                    if (el && /^\d+$/.test(el.textContent.trim())) c[p[1]] = el.textContent.trim();
                });
            });
            return;
        }
        if (tries >= 16) { // 8 秒无响应：缓存兜底，无缓存隐藏该行
            clearInterval(timer);
            SITE.forEach(function (p) {
                var el = document.getElementById(p[0]);
                if (el && spin(el)) {
                    if (cached && cached[p[1]]) el.textContent = cached[p[1]];
                    else el.closest('.webinfo-item').style.display = 'none';
                }
            });
        }
    }, 500);
})();
</script>

<script>
// 统一弹窗关闭动效 / Esc 关闭所有弹窗 / 离线提示 / 相对时间
(function () {
    // 关闭动效：先播 .is-closing 动画再隐藏
    window.__closePop = function (el) {
        if (!el || el.hidden || el.classList.contains('is-closing')) return;
        el.classList.add('is-closing');
        var done = function () { el.classList.remove('is-closing'); el.hidden = true; };
        el.addEventListener('animationend', done, { once: true });
        setTimeout(done, 260);
    };

    // Esc：关闭所有弹窗（游戏/壁纸/工具/相册/音乐/搜索/海报/图片灯箱）
    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        document.querySelectorAll('.games-pop, .music-app').forEach(function (el) {
            if (!el.hidden) window.__closePop(el);
        });
        var sd = document.querySelector('#local-search .search-dialog.open');
        if (sd) { var sc = document.querySelector('#local-search .search-close-button'); if (sc) sc.click(); }
        var pm = document.querySelector('.pe-poster-mask'); if (pm) pm.remove();
        var im = document.getElementById('imageModal');
        if (im && im.style.display === 'block') im.style.display = 'none';
    });

    // 离线提示
    var pill = document.createElement('div');
    pill.className = 'offline-pill';
    pill.textContent = '网络已断开';
    document.body.appendChild(pill);
    function updOffline() { pill.classList.toggle('is-offline', !navigator.onLine); }
    window.addEventListener('offline', updOffline);
    window.addEventListener('online', updOffline);
    updOffline();

    // 相对时间：time[datetime] 显示"x 天前"，hover/原属性保留完整日期
    function relTime() {
        var m = { 31536000: '年前', 2592000: '个月前', 86400: '天前', 3600: '小时前', 60: '分钟前' };
        document.querySelectorAll('time[datetime]').forEach(function (el) {
            var d = new Date(el.getAttribute('datetime'));
            if (isNaN(d.getTime()) || el.getAttribute('data-rel')) return;
            el.setAttribute('data-rel', '1');
            if (!el.getAttribute('title')) el.setAttribute('title', el.textContent.trim());
            var diff = Date.now() - d.getTime();
            if (diff < 60000) { el.textContent = '刚刚'; return; }
            var out = '刚刚';
            for (var k in m) if (diff >= k * 1000) { out = Math.floor(diff / (k * 1000)) + m[k]; break; }
            el.textContent = out;
        });
    }
    relTime();
})();
</script>
<script>
// 站点增强：阅读进度条 / Ctrl+K 搜索 / 随机一读 / 建站天数 / Service Worker
(function () {
    // 阅读进度条（仅文章页显示）
    var bar = document.getElementById('reading-progress')
    if (bar && document.body.classList.contains('type-post')) {
        var updateBar = function () {
            var el = document.documentElement
            var max = el.scrollHeight - el.clientHeight
            bar.style.width = (max > 0 ? (el.scrollTop / max) * 100 : 0) + '%'
        }
        window.addEventListener('scroll', updateBar, { passive: true })
        updateBar()
    }

    // Ctrl+K / Cmd+K 唤起站内搜索
    document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k') {
            e.preventDefault()
            var btn = document.querySelector('#search-button .search')
            if (btn) btn.click()
        }
    })

    // 随机一读
    var goRandom = document.getElementById('go-random')
    if (goRandom) {
        goRandom.addEventListener('click', function () {
            var urls = ["/2026/09/01/redis/","/2026/08/31/redis/","/2026/08/28/redis/","/2025/12/26/IO%E5%9F%BA%E7%A1%80%E4%B8%8E%E6%B5%81%E6%93%8D%E4%BD%9C/","/2025/12/08/best-buddy/"]
            if (!urls.length) return
            var pick
            do { pick = urls[Math.floor(Math.random() * urls.length)] } while (urls.length > 1 && pick === location.pathname)
            location.href = pick
        })
    }

    // 建站天数
    var uptime = document.getElementById('site-uptime')
    if (uptime) {
        var start = new Date('2025-01-01T00:00:00+08:00')
        var days = Math.floor((Date.now() - start.getTime()) / 86400000)
        if (days > 0) uptime.textContent = days + ' 天'
        else uptime.closest('.webinfo-item').style.display = 'none'
    }

    // Service Worker（仅线上环境注册，避免污染本地开发）
    if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
    }
})();
</script>
<script>
window.showImage = function(imageURL, event){ if(event) event.preventDefault(); var m=document.getElementById('imageModal'),i=document.getElementById('modalImage'); if(m&&i){ i.src=imageURL; m.style.display='block'; } };
document.addEventListener('DOMContentLoaded', function(){
    var modal=document.getElementById('imageModal');
    if(modal){ modal.addEventListener('click', function(){ modal.style.display='none'; }); }
});
</script>
